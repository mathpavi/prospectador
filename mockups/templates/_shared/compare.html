{# M2: antes/depois. So aparece se antes.jpg e depois.jpg existirem (gerados junto com o esboco). #}
<style>
.pv-cmpbtn{border:0;cursor:pointer;background:transparent;color:inherit;font:600 .875rem/1 inherit;padding:.7em 1.1em;border-radius:999px;box-shadow:inset 0 0 0 1px currentColor;white-space:nowrap;opacity:.9}
.pv-cmpbtn:hover{opacity:1}
.pv-cmp{position:fixed;inset:0;z-index:100;background:rgba(8,9,11,.88);display:none;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px);animation:pvIn .35s var(--ease) both}
.pv-cmp.open{display:flex}
.pv-cmp .in{position:relative;width:min(1180px,100%);aspect-ratio:1440/900;max-height:82vh;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px -20px #000;background:#111;user-select:none;touch-action:none}
.pv-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;pointer-events:none}
.pv-cmp .pvt{clip-path:inset(0 50% 0 0)}
.pv-cmp .bar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.pv-cmp .bar i{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4);display:grid;place-items:center;font:700 18px/1 system-ui;color:#111;font-style:normal}
.pv-cmp .tag{position:absolute;top:14px;padding:.45em .9em;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font:600 .8rem/1 system-ui;pointer-events:none}
.pv-cmp .tag.l{left:14px}.pv-cmp .tag.r{right:62px;background:var(--t-accent);color:var(--t-on-accent)}
.pv-cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.pv-cmp .x{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font:20px/1 system-ui;cursor:pointer}
.pv-cmp .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font:500 .85rem/1 system-ui;text-shadow:0 1px 6px #000;pointer-events:none}
</style>
<div class="pv-cmp" id="pvCmp" role="dialog" aria-modal="true" aria-label="Comparar site atual e esboço">
  <div class="in" id="pvCmpIn">
    <img src="depois.jpg" alt="Esboço"><img class="pvt" id="pvCmpTop" src="antes.jpg" alt="Site atual">
    <div class="bar" id="pvCmpBar"><i>&#8596;</i></div>
    <span class="tag l">Site atual</span><span class="tag r">Esboço</span>
    <input type="range" id="pvCmpR" min="0" max="100" value="50" aria-label="Arraste para comparar">
    <div class="cap">Arraste para comparar</div>
    <button class="x" type="button" id="pvCmpX" aria-label="Fechar">&times;</button>
  </div>
</div>
<script>
(function(){
var a=new Image(),d=new Image(),n=0;function ready(){if(++n<2)return;var bar=document.querySelector('.proposal');if(!bar)return;
 var b=document.createElement('button');b.type='button';b.className='pv-cmpbtn';b.textContent='Ver antes e depois';var link=bar.querySelector('a');bar.insertBefore(b,link);
 var m=document.getElementById('pvCmp'),r=document.getElementById('pvCmpR'),top=document.getElementById('pvCmpTop'),br=document.getElementById('pvCmpBar'),t=null;
 function set(v){top.style.clipPath='inset(0 '+(100-v)+'% 0 0)';br.style.left=v+'%';r.value=v}
 function open(){m.classList.add('open');document.body.style.overflow='hidden';var v=100,s=null;set(100);clearInterval(t);t=setInterval(function(){v-=2;set(v);if(v<=50)clearInterval(t)},16)}
 function close(){m.classList.remove('open');document.body.style.overflow='';clearInterval(t)}
 b.onclick=open;r.oninput=function(){clearInterval(t);set(+r.value)};document.getElementById('pvCmpX').onclick=close;
 m.addEventListener('click',function(e){if(e.target===m)close()});document.addEventListener('keydown',function(e){if(e.key==='Escape')close()})}
a.onload=ready;d.onload=ready;a.src='antes.jpg';d.src='depois.jpg';
})();
</script>
