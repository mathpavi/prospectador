{# Animacoes e utilitarios compartilhados: barra de progresso, parallax, contadores, revelar imagens, botao magnetico, envio por WhatsApp. #}
<style>
.pv-prog{position:fixed;left:0;top:0;height:3px;width:0;background:var(--t-accent);z-index:60;transition:width .12s linear}
.rv-off .pv-prog{display:none}
.js:not(.rv-off) main img.pv-ix{clip-path:inset(0 0 100% 0);transform:scale(1.06);transition:clip-path 1.1s var(--ease),transform 1.4s var(--ease)}
.js:not(.rv-off) main img.pv-ix.in{clip-path:inset(0);transform:none}
.js:not(.rv-off) .pv-hero-in{animation:pvHero 1.1s var(--ease) both}
@keyframes pvHero{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
h2.rv::after{content:"";display:block;width:0;height:2px;background:var(--t-accent);margin-top:16px;transition:width .9s .25s var(--ease)}
h2.rv.in::after,.rv-off h2.rv::after{width:56px}
.btn{will-change:transform}
.pv-toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);background:var(--t-text);color:var(--t-bg);padding:.8em 1.2em;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.4s var(--ease);z-index:70}
.pv-toast.show{opacity:1;transform:translate(-50%,0)}
.pv-card{transition:transform .45s var(--ease),box-shadow .45s}.pv-card:hover{transform:translateY(-6px);box-shadow:0 22px 40px -24px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){.js main img.pv-ix{clip-path:none!important;transform:none!important}.pv-hero-in{animation:none!important}h2.rv::after{width:56px}}
</style>
<div class="pv-prog" id="pvProg"></div>
<div class="pv-toast" id="pvToast" role="status"></div>
<script>
(function(){
var W='{{ s.wa_url }}',T='{{ s.tel_url }}',reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function toast(m){var t=document.getElementById('pvToast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},3200)}
window.pvSend=function(text){
 if(W){window.open(W+'?text='+encodeURIComponent(text),'_blank','noopener');return}
 var ok=function(){toast('Resumo copiado. Cole no WhatsApp ou envie por e-mail.')},no=function(){toast('Não foi possível copiar: anote o resumo e envie à equipe.')};
 try{navigator.clipboard.writeText(text).then(ok,no)}catch(e){no()}};
var doc=document.documentElement,prog=document.getElementById('pvProg');
function onScroll(){var h=doc.scrollHeight-innerHeight;if(prog)prog.style.width=(h>0?scrollY/h*100:0)+'%';
 if(!reduce&&par){var r=par.parentElement.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight){par.style.transform='translateY('+(-r.top*.12).toFixed(1)+'px) scale(1.12)'}}}
var par=null;(function(){var im=document.querySelector('main img');if(im&&!reduce){var p=im.parentElement;if(p&&getComputedStyle(p).overflow!=='visible'){par=im;im.style.transition='none';im.style.willChange='transform'}}})();
addEventListener('scroll',onScroll,{passive:true});onScroll();
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');if(e.target.dataset.cnt)count(e.target);io.unobserve(e.target)}})},{threshold:.15}):null;
var imgs=document.querySelectorAll('main img'),first=true;[].forEach.call(imgs,function(im,k){if(im===par||!io)return;var r=im.getBoundingClientRect();if(k>0||r.top>innerHeight*.9){im.classList.add('pv-ix');io.observe(im)}});
[].forEach.call(document.querySelectorAll('.hw div'),function(d){if(io)io.observe(d)});
function count(el){var m=el.dataset.cnt.match(/(\d[\d.]*)/);if(!m)return;var end=parseFloat(m[1].replace(/\./g,'')),pre=el.dataset.cnt.slice(0,m.index),suf=el.dataset.cnt.slice(m.index+m[1].length),t0=null;
 if(reduce||end>100000)return;function step(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/1300),v=Math.round(end*(1-Math.pow(1-p,3)));el.textContent=pre+(end>=1000?v.toLocaleString('pt-BR'):v)+suf;if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
[].forEach.call(document.querySelectorAll('.fine b,.facts b,.stat b'),function(b){var tx=b.textContent.trim();if(/^\D{0,2}\d[\d.]*(\s|\D|$)/.test(tx)&&!/\d{4}/.test(tx.replace(/\./g,''))){b.dataset.cnt=tx;if(io)io.observe(b)}});
if(!reduce){[].forEach.call(document.querySelectorAll('.btn'),function(b){b.addEventListener('mousemove',function(e){var r=b.getBoundingClientRect();b.style.transform='translate('+((e.clientX-r.left-r.width/2)*.14).toFixed(1)+'px,'+((e.clientY-r.top-r.height/2)*.22).toFixed(1)+'px)'});b.addEventListener('mouseleave',function(){b.style.transform=''})});
 [].forEach.call(document.querySelectorAll('.hero .copy>*:not(.rv),.hero-copy>*:not(.rv),.top'),function(e,k){e.classList.add('pv-hero-in');e.style.animationDelay=(k*90)+'ms'});
 [].forEach.call(document.querySelectorAll('.tile,.card,.area,.prod,.gallery figure'),function(e){e.classList.add('pv-card')})}
})();
</script>
<style>
/* revelacao forte: itens SURGEM (de baixo, dos lados ou com zoom), em sequencia */
.js:not(.rv-off) .rv{opacity:0;transform:translate3d(0,56px,0) scale(.97);filter:blur(7px);transition:opacity 1s var(--ease),transform 1.05s var(--ease),filter .9s var(--ease)}
.js:not(.rv-off) .rv[data-fx=l]{transform:translate3d(-80px,0,0)}
.js:not(.rv-off) .rv[data-fx=r]{transform:translate3d(80px,0,0)}
.js:not(.rv-off) .rv[data-fx=z]{transform:scale(.82)}
.js:not(.rv-off) .rv.in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}}
/* botoes: brilho que varre, elevacao, sombra na cor da marca, ondulacao no clique */
.btn,.proposal a{position:relative;overflow:hidden;isolation:isolate;transition:transform .35s var(--ease),box-shadow .35s var(--ease),filter .3s,background .3s,color .3s!important}
.btn::before,.proposal a::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 28%,rgba(255,255,255,.42) 50%,transparent 72%);transform:translateX(-130%);transition:transform .75s var(--ease)}
.btn:hover::before,.proposal a:hover::before{transform:translateX(130%)}
.btn:hover,.proposal a:hover{transform:translate(var(--mx,0px),calc(var(--my,0px) - 3px)) scale(1.045)!important;box-shadow:0 14px 28px -12px var(--t-accent)!important;filter:brightness(1.07)}
.btn:active,.proposal a:active{transform:scale(.96)!important}
.btn.ghost:hover{background:var(--t-accent)!important;color:var(--t-on-accent)!important;box-shadow:0 14px 28px -12px var(--t-accent)!important}
.pv-rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:pvRip .7s ease-out forwards;pointer-events:none;z-index:-1}
@keyframes pvRip{to{transform:scale(1);opacity:0}}
.nav a:not(.btn){position:relative}.nav a:not(.btn)::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--t-accent);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav a:not(.btn):hover::after{transform:scaleX(1)}
.tool .chip:active{transform:scale(.94)}
.tool .chip.on{animation:pvPop .4s var(--ease)}@keyframes pvPop{50%{transform:scale(1.12)}}
/* mensagem rotativa da faixa da proposta */
.pv-tag{position:relative;flex:1;min-width:0;height:1.4em;overflow:hidden;font-weight:600;text-align:center}
.pv-tag i{position:absolute;inset:0;font-style:normal;opacity:0;transform:translateY(60%);transition:opacity .6s var(--ease),transform .6s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-tag i.on{opacity:1;transform:none}
.proposal{gap:14px}.proposal>span:first-child{flex:none}
@media (max-width:760px){.pv-tag{font-size:.8rem}}
</style>
<script>
(function(){
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
if(document.documentElement.classList.contains('rv-off'))return;
/* mais itens passam a surgir: textos, listas, figuras, secoes sem classe de revelacao */
var sel='main section h2,main section .label,main section p,main section li,main section figure,main section details,main section address,main section .fine div,main section .sum,main section .tw .box,footer';
var skip='.hero,.top,.proposal,.tool .pane,.tool .sum,.pv-toast,.rv,.hw div';
[].forEach.call(document.querySelectorAll(sel),function(e){if(e.classList.contains('rv')||e.closest('.rv')||e.closest('.hero')||e.closest('.top')||e.closest('.proposal')||e.closest('.tool .box')&&!e.classList.contains('box'))return;e.classList.add('rv')});
/* direcao e atraso por irmao: alterna esquerda/direita em grades, zoom em figuras/cartoes, escalona listas */
var seen=new Map();
[].forEach.call(document.querySelectorAll('.rv'),function(e){var par=e.parentElement,n=seen.get(par)||0;seen.set(par,n+1);
 if(e.matches('figure,.tile,.card,.box,.it'))e.dataset.fx='z';else if(par&&par.children.length>1&&getComputedStyle(par).display==='grid'&&!e.matches('li'))e.dataset.fx=n%2?'r':'l';
 e.style.transitionDelay=Math.min(n,7)*85+'ms'});
/* observador proprio (garante o gatilho nos itens adicionados acima) */
if('IntersectionObserver' in window&&!reduce){var io2=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io2.unobserve(x.target)}})},{rootMargin:'0px 0px -6% 0px',threshold:.08});
 [].forEach.call(document.querySelectorAll('.rv:not(.in)'),function(e){io2.observe(e)})}
/* botoes: atracao do mouse via variaveis + ondulacao no clique */
[].forEach.call(document.querySelectorAll('.btn,.proposal a'),function(b){
 b.addEventListener('mousemove',function(e){var r=b.getBoundingClientRect();b.style.setProperty('--mx',((e.clientX-r.left-r.width/2)*.12).toFixed(1)+'px');b.style.setProperty('--my',((e.clientY-r.top-r.height/2)*.2).toFixed(1)+'px')});
 b.addEventListener('mouseleave',function(){b.style.removeProperty('--mx');b.style.removeProperty('--my')});
 b.addEventListener('click',function(e){var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='pv-rip';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.appendChild(s);setTimeout(function(){s.remove()},750)})});
/* mensagem rotativa na faixa */
var bar=document.querySelector('.proposal');if(bar){var t=document.querySelector('.pv-tag i');var items=[].slice.call(document.querySelectorAll('.pv-tag i')),k=0;
 if(items.length>1&&!reduce)setInterval(function(){items[k].classList.remove('on');k=(k+1)%items.length;items[k].classList.add('on')},4200)}
})();
</script>
